[package]
name = "laryko"
version = "0.1.1"
description = "Laryko - Aplicación multiplataforma offline-first"
authors = ["Laryko"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "laryko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
